<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pulse Filter -->
    <filter id="pulseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient Pulsing Rings */
    @keyframes pulseRing {
      0% { r: 24px; opacity: 0.8; }
      50% { r: 52px; opacity: 0.2; }
      100% { r: 24px; opacity: 0.8; }
    }
    @keyframes pulseRing2 {
      0% { r: 36px; opacity: 0.5; }
      50% { r: 70px; opacity: 0.05; }
      100% { r: 36px; opacity: 0.5; }
    }
    .pulse-ring-1 {
      animation: pulseRing 3.5s ease-in-out infinite;
    }
    .pulse-ring-2 {
      animation: pulseRing2 3.5s ease-in-out infinite;
    }

    /* Floating Data Packets */
    @keyframes flowPacket1 {
      0% { cx: 220px; cy: 180px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 980px; cy: 110px; opacity: 0; }
    }
    @keyframes flowPacket2 {
      0% { cx: 220px; cy: 180px; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 980px; cy: 250px; opacity: 0; }
    }
    .packet-1 {
      animation: flowPacket1 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .packet-2 {
      animation: flowPacket2 4s cubic-bezier(0.4, 0, 0.2, 1) infinite 2s;
    }

    /* Alert Badge Shake */
    @keyframes subtlePing {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .ping-icon {
      transform-origin: 1045px 75px;
      animation: subtlePing 2s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Grid Decoration in Background -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic Signal / Wave Lines (Background Layer) -->
  <path d="M 120 180 Q 550 50, 980 110" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6,6" />
  <path d="M 120 180 Q 550 310, 980 250" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6,6" />

  <!-- Animated Flying Data Packets -->
  <circle class="packet-1" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle class="packet-2" r="5" fill="#c084fc" filter="url(#glow)" />

  <!-- Dynamic Pulsing Emitter (Left) -->
  <g transform="translate(120, 180)">
    <circle class="pulse-ring-2" cx="0" cy="0" r="36" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <circle class="pulse-ring-1" cx="0" cy="0" r="24" fill="none" stroke="#818cf8" stroke-width="2" />
    <circle cx="0" cy="0" r="16" fill="url(#accentGrad)" filter="url(#glow)" />
    <!-- Bell Icon Inside Origin -->
    <path d="M -6 4 A 6 6 0 0 1 6 4 L 7 7 L -7 7 Z M -2 8 A 2 2 0 0 0 2 8" fill="#ffffff" />
  </g>

  <!-- Foreground Content Block -->
  <g transform="translate(230, 95)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#38bdf8" />
    <text x="30" y="21" class="badge-text" fill="#38bdf8">PUSH &amp; REAL-TIME ALERTS</text>

    <!-- Main Title -->
    <text x="0" y="76" class="title-text">Awesome Push Notification</text>
    <text x="0" y="124" class="title-text" fill="url(#accentGrad)">&amp; Alert Service</text>

    <!-- Subtitle -->
    <text x="0" y="166" class="subtitle-text">Curated SaaS platforms, Open-Source infrastructure, and developer APIs</text>
    <text x="0" y="194" class="subtitle-text" fill="#64748b">Cross-channel delivery across Web Push, APNs, FCM, SMS, Email &amp; In-App</text>
  </g>

  <!-- Right Side Interactive Card Indicator -->
  <g transform="translate(1005, 55)" class="ping-icon">
    <circle cx="40" cy="40" r="30" fill="#ef4444" fill-opacity="0.15" />
    <circle cx="40" cy="40" r="20" fill="#ef4444" fill-opacity="0.3" filter="url(#glow)" />
    <circle cx="40" cy="40" r="12" fill="#ef4444" />
    <path d="M 37 36 L 43 36 L 43 43 L 37 43 Z M 37 45 L 43 45 L 43 47 L 37 47 Z" fill="#ffffff" />
  </g>
</svg>
